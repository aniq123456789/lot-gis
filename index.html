<script>
    // --- LOGIN ---
    function checkLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if (user === "1" && pass === "admin") {
            document.getElementById('login-overlay').style.display = 'none';
            map.invalidateSize();
        } else {
            document.getElementById('login-error').style.display = 'block';
            const card = document.querySelector('.login-card');
            card.style.animation = "shake 0.5s";
            setTimeout(() => card.style.animation = "", 500);
        }
    }

    // --- MAP LOGIC ---
    // Inisialisasi map tanpa menambah layer terus
    var map = L.map('map', { 
        zoomControl: false, 
        attributionControl: false, 
        preferCanvas: true 
    }).setView([2.10385, 102.5214], 19);

    // --- DEFINISI BASE LAYERS (GOOGLE MAPS) ---
    var googleSatellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { 
        maxZoom: 22, 
        crossOrigin: 'anonymous' 
    }).addTo(map); // Set sebagai default

    var googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 22,
        crossOrigin: 'anonymous'
    });

    var highlightLayer;
    window.selectedLotData = { lot: "-", owner: "-", area: "-" };

    function updateDisplay(props) {
        const lot = props['NO LOT'] || "-";
        const owner = props['tsp — pe'] || props['Pemilik'] || "Jabatan Geomatik (PUO)";
        const area = props['AREA'] ? parseFloat(props['AREA']).toFixed(3) + " m²" : "-";

        document.getElementById('res-no-lot').innerText = lot;
        document.getElementById('res-owner').innerText = owner;
        document.getElementById('res-luas').innerText = area;

        window.selectedLotData = { lot, owner, area };
    }

    // --- LAYER GROUP UNTUK OVERLAYS ---
    var batuSempadanGroup = L.layerGroup().addTo(map);
    
    var lotLayer = L.geoJson(json_LOTFINAL_0, {
        style: { color: 'white', weight: 1.5, fillColor: '#e74c3c', fillOpacity: 0.3 },
        onEachFeature: function(feature, layer) {
            if (feature.properties['NO LOT']) {
                $('#lotSearchSelector').append(`<option value="${feature.properties['NO LOT']}">Lot ${feature.properties['NO LOT']}</option>`);
            }

            if (feature.geometry && (feature.geometry.type === 'Polygon' || feature.geometry.type === 'MultiPolygon')) {
                var coords = layer.getLatLngs();
                var vertices = feature.geometry.type === 'MultiPolygon' ? coords.flat(2) : coords[0];

                vertices.forEach(function(latlng) {
                    var marker = L.circleMarker(latlng, {
                        radius: 4,      
                        fillColor: "white", 
                        color: "#000",      
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 1,
                        interactive: true 
                    });

                    marker.addTo(batuSempadanGroup);

                    marker.on('mouseover', function(e) {
                        this.setStyle({ fillColor: '#27ae60', radius: 6 });
                        var coordContent = `
                            <div style="text-align:center;">
                                <b style="color:#f1c40f;">BATU SEMPADAN</b><br>
                                Lat: ${latlng.lat.toFixed(7)}<br>
                                Lng: ${latlng.lng.toFixed(7)}
                            </div>
                        `;
                        this.bindTooltip(coordContent, { 
                            sticky: true, 
                            direction: 'top',
                            className: 'leaflet-tooltip-own tooltip-coordinate' 
                        }).openTooltip();
                    });

                    marker.on('mouseout', function(e) {
                        this.setStyle({ fillColor: 'white', radius: 4 });
                    });
                });
            }

            layer.on('mouseover', function(e) {
                var layer = e.target;
                layer.setStyle({ weight: 3, color: '#ffff00', fillOpacity: 0.6 });
                updateDisplay(layer.feature.properties);
                var content = `
                    <div style="font-size:12px;">
                        <b>LOT: ${layer.feature.properties['NO LOT']}</b><br>
                        Pemilik: ${layer.feature.properties['Pemilik'] || "PUO"}<br>
                        Luas: ${parseFloat(layer.feature.properties['AREA']).toFixed(2)} m²
                    </div>
                `;
                layer.bindTooltip(content, { sticky: true, className: 'leaflet-tooltip-own' }).openTooltip();
            });

            layer.on('mouseout', function(e) {
                if (highlightLayer !== e.target) {
                    lotLayer.resetStyle(e.target);
                }
            });

            layer.on('click', function(e) {
                if (highlightLayer) { lotLayer.resetStyle(highlightLayer); }
                highlightLayer = e.target;
                highlightLayer.setStyle({ weight: 5, color: '#ffff00', fillOpacity: 0.4 });
                map.flyToBounds(e.target.getBounds(), { padding: [100, 100] });
                updateDisplay(e.target.feature.properties);
            });
        }
    }).addTo(map);

    // --- KAWALAN ON/OFF (BASE LAYERS & OVERLAYS) ---
    var baseMaps = {
        "Google Satellite": googleSatellite,
        "Google Streets": googleStreets
    };

    var overlays = {
        "Garisan Sempadan": lotLayer,
        "Batu Sempadan": batuSempadanGroup
    };
    
    // Menambah kawalan ke peta
    L.control.layers(baseMaps, overlays, { 
        collapsed: false, 
        position: 'topright' 
    }).addTo(map);

    $('#lotSearchSelector').change(function() {
        var val = $(this).val();
        lotLayer.eachLayer(layer => {
            if (layer.feature.properties['NO LOT'] == val) {
                if (highlightLayer) { lotLayer.resetStyle(highlightLayer); }
                highlightLayer = layer;
                highlightLayer.setStyle({ weight: 5, color: '#ffff00', fillOpacity: 0.4 });
                map.flyToBounds(layer.getBounds(), { padding: [100, 100] });
                updateDisplay(layer.feature.properties);
            }
        });
    });

    $('#sidebarCollapse').click(function() { $('#sidebar').toggleClass('active'); });

    // --- PDF GENERATION ---
    async function generateFinalPDF() {
        if(window.selectedLotData.lot === "-") { alert("Sila pilih satu lot."); return; }
        const overlay = document.getElementById('loading-overlay');
        overlay.style.display = "block";

        let tempMarker;
        if(highlightLayer) {
            map.fitBounds(highlightLayer.getBounds(), { padding: [140, 140], animate: false });
            var center = highlightLayer.getBounds().getCenter();
            tempMarker = L.marker(center, {
                icon: L.divIcon({ className: 'map-label-focused', html: `<div style="background:rgba(26,37,47,0.8); color:white; padding:2px 5px; border:1px solid red; border-radius:3px; font-weight:bold; font-size:10px;">LOT ${window.selectedLotData.lot}</div>`, iconSize: [80, 30] })
            }).addTo(map);
        }

        await new Promise(r => setTimeout(r, 1500));

        try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a3'); 
            const canvas = await html2canvas(document.getElementById('map'), { useCORS: true, scale: 3 });
            const imgData = canvas.toDataURL('image/png');

            doc.setDrawColor(30); doc.rect(10, 10, 400, 277); doc.line(95, 10, 95, 287); 

            try {
                doc.addImage(document.getElementById("logoPoliRef"), 'PNG', 20, 20, 25, 25);
                doc.addImage(document.getElementById("logoPuoRef"), 'PNG', 65, 20, 22, 25);
            } catch(e) {}

            doc.setFont("times", "bold"); doc.setFontSize(16);
            doc.text("LAPORAN RASMI", 52.5, 55, {align: "center"});
            doc.text("LOT TANAH DIGITAL", 52.5, 62, {align: "center"});
            doc.setFontSize(10); doc.text("Jabatan Geomatik, PUO", 52.5, 70, {align: "center"});
            doc.line(20, 75, 85, 75);

            let startY = 95;
            const data = [["NOMBOR LOT", window.selectedLotData.lot], ["PEMILIK", window.selectedLotData.owner.toUpperCase()], ["KELUASAN", window.selectedLotData.area], ["TARIKH", new Date().toLocaleDateString('ms-MY')]];
            data.forEach(row => {
                doc.setFillColor(248, 249, 250); doc.rect(18, startY, 70, 20, 'F');
                doc.setFontSize(8); doc.setTextColor(120); doc.text(row[0], 22, startY + 6);
                doc.setFontSize(11); doc.setTextColor(0); doc.text(doc.splitTextToSize(row[1], 65), 22, startY + 13);
                startY += 28;
            });

            doc.addImage(imgData, 'PNG', 97, 14, 308, 269);
            doc.setFontSize(8); doc.text("Sistem Saujana Putra Smart Resident © 2026", 52.5, 275, {align: "center"});
            doc.save(`Laporan_Lot_${window.selectedLotData.lot}.pdf`);
        } catch (err) { alert("Ralat menjana laporan."); }
        finally { if(tempMarker) map.removeLayer(tempMarker); overlay.style.display = "none"; }
    }
</script>
