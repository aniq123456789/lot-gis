
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOMATIK NOTES</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    height: 100vh;
    background: #10243e;
    color: white;
    position: fixed;
    padding: 25px 15px;
    overflow-y: auto;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    padding: 10px;
    margin-bottom: 8px;
    color: #60a5fa;
}

.logo small {
    display: block;
    color: #cbd5e1;
    font-size: 11px;
    margin-top: 7px;
    font-weight: normal;
}

.sidebar h4 {
    font-size: 11px;
    color: #94a3b8;
    margin: 25px 10px 12px;
    letter-spacing: 1px;
}

.sidebar button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px;
    margin: 5px 0;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: #dbeafe;
    cursor: pointer;
    font-size: 14px;
}

.sidebar button:hover,
.sidebar button.active {
    background: #2563eb;
    color: white;
}

/* MAIN */
.main {
    margin-left: 250px;
    padding: 30px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.topbar h1 {
    font-size: 25px;
}

.topbar p {
    color: #64748b;
    margin-top: 7px;
    font-size: 13px;
}

.add-btn {
    background: #2563eb;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn:hover {
    background: #1d4ed8;
}

/* STATISTICS */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 30px;
}

.stat-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 2px 8px #00000008;
}

.stat-card p {
    color: #64748b;
    font-size: 13px;
}

.stat-card h2 {
    margin-top: 12px;
    color: #2563eb;
    font-size: 28px;
}

/* SEARCH */
.search-area {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
}

.search-area input,
.search-area select {
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: white;
    outline: none;
}

.search-area input {
    flex: 1;
    min-width: 0;
}

/* NOTES */
.section-title {
    font-size: 19px;
    margin-bottom: 18px;
}

.notes-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.note-card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    transition: 0.2s;
    min-width: 0;
}

.note-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 15px #00000012;
}

.category {
    display: inline-block;
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 11px;
    padding: 6px 9px;
    border-radius: 20px;
    margin-bottom: 15px;
}

.note-card h3 {
    font-size: 17px;
    margin-bottom: 10px;
}

.note-card p {
    color: #64748b;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.note-date {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 17px;
}

.note-actions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.note-actions button {
    padding: 8px 11px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
}

.edit-btn {
    background: #dbeafe;
    color: #1d4ed8;
}

.delete-btn {
    background: #fee2e2;
    color: #dc2626;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #00000080;
    z-index: 10;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modal-content {
    background: white;
    width: 500px;
    max-width: 100%;
    padding: 25px;
    border-radius: 12px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-content h2 {
    margin-bottom: 20px;
}

.modal-content label {
    display: block;
    margin: 13px 0 7px;
    font-size: 13px;
    font-weight: bold;
}

.modal-content input,
.modal-content select,
.modal-content textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    outline: none;
}

.modal-content textarea {
    min-height: 150px;
    resize: vertical;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.save-btn {
    background: #2563eb;
    color: white;
}

.cancel-btn {
    background: #e2e8f0;
    color: #334155;
}

/* EMPTY */
.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px 15px;
    color: #64748b;
    background: white;
    border-radius: 10px;
}

.tools {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.tools button {
    border: 1px solid #cbd5e1;
    background: white;
    padding: 10px 13px;
    border-radius: 7px;
    cursor: pointer;
}

.tools button:hover {
    background: #dbeafe;
}

/* RESPONSIVE */
@media(max-width: 1000px) {
    .notes-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 700px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .main {
        margin-left: 0;
        padding: 20px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .notes-container {
        grid-template-columns: 1fr;
    }

    .search-area {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo">
        GEOMATIK NOTES
        <small>YOUR DIGITAL KNOWLEDGE HUB</small>
    </div>

    <h4>MENU UTAMA</h4>

    <button class="active" onclick="filterCategory('Semua Nota',this)">
        🏠 Dashboard
    </button>

    <h4>KATEGORI NOTA</h4>

    <div id="categoryMenu"></div>

    <h4>PENGURUSAN</h4>

    <button onclick="exportNotes()">
        📥 Backup Nota
    </button>

    <button onclick="document.getElementById('importFile').click()">
        📤 Import Nota
    </button>

    <input type="file" id="importFile"
    accept=".json,application/json"
    hidden onchange="importNotes(event)">

</div>

<!-- MAIN CONTENT -->
<div class="main">

    <div class="topbar">
        <div>
            <h1>Dashboard</h1>
            <p>Selamat datang ke pusat penyimpanan nota Geomatik.</p>
        </div>

        <button class="add-btn" onclick="openModal()">
            + Tambah Nota
        </button>
    </div>

    <!-- STATISTICS -->
    <div class="stats">

        <div class="stat-card">
            <p>Jumlah Nota</p>
            <h2 id="totalNotes">0</h2>
        </div>

        <div class="stat-card">
            <p>Jumlah Kategori</p>
            <h2 id="totalCategories">0</h2>
        </div>

        <div class="stat-card">
            <p>Nota Tersimpan</p>
            <h2>✓</h2>
        </div>

    </div>

    <!-- TOOLS -->
    <div class="tools">
        <button onclick="exportNotes()">📥 Export Data</button>
        <button onclick="document.getElementById('importFile').click()">
            📤 Import Data
        </button>
    </div>

    <!-- SEARCH -->
    <div class="search-area">

        <input type="text"
        id="searchInput"
        placeholder="🔍 Cari tajuk atau kandungan nota..."
        oninput="renderNotes()">

        <select id="categoryFilter" onchange="renderNotes()">
            <option value="Semua Nota">Semua Kategori</option>
        </select>

    </div>

    <h2 class="section-title" id="sectionTitle">
        Semua Nota
    </h2>

    <div class="notes-container" id="notesContainer"></div>

</div>

<!-- MODAL TAMBAH NOTA -->
<div class="modal" id="noteModal">

    <div class="modal-content">

        <h2 id="modalTitle">Tambah Nota Baharu</h2>

        <form id="noteForm">

            <input type="hidden" id="noteId">

            <label>Tajuk Nota</label>
            <input type="text" id="noteTitle"
            placeholder="Contoh: Introduction to Geodesy"
            required>

            <label>Kategori</label>

            <select id="noteCategory" required>
            </select>

            <label>Kandungan Nota</label>

            <textarea id="noteContent"
            placeholder="Masukkan isi nota anda di sini..."
            required></textarea>

            <div class="modal-buttons">

                <button type="submit" class="save-btn">
                    Simpan Nota
                </button>

                <button type="button" class="cancel-btn"
                onclick="closeModal()">
                    Batal
                </button>

            </div>

        </form>

    </div>

</div>

<script>

// SENARAI KATEGORI
const categories = [
    "Cadastral Survey",
    "Engineering Survey",
    "Geodesy",
    "Survey Adjustment",
    "Photogrammetry",
    "Remote Sensing",
    "GIS",
    "Hydrographic Survey",
    "Land Law",
    "Land Administration",
    "Cartography",
    "General Geomatics"
];

// SIMPAN DATA DALAM BROWSER
let notes = [];

try {
    const saved = localStorage.getItem("geomatikNotes");
    notes = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(notes)) notes = [];
} catch (error) {
    notes = [];
}

let currentCategory = "Semua Nota";

// PAPAR KATEGORI
function setupCategories() {

    const menu = document.getElementById("categoryMenu");
    const filter = document.getElementById("categoryFilter");
    const select = document.getElementById("noteCategory");

    categories.forEach(category => {

        const button = document.createElement("button");
        button.textContent = "📁 " + category;

        button.onclick = () => {
            currentCategory = category;
            filter.value = category;
            document.getElementById("sectionTitle").textContent = category;
            document.querySelectorAll(".sidebar button")
                .forEach(b => b.classList.remove("active"));
            button.classList.add("active");
            renderNotes();
        };

        menu.appendChild(button);

        filter.add(new Option(category, category));
        select.add(new Option(category, category));

    });

}

// SIMPAN NOTA
function saveData() {
    try {
        localStorage.setItem("geomatikNotes", JSON.stringify(notes));
        updateStats();
    } catch (error) {
        alert("Storan penuh atau tidak dapat diakses. Sila export data anda.");
    }
}

// KEMAS KINI STATISTIK
function updateStats() {

    document.getElementById("totalNotes").textContent = notes.length;

    const usedCategories = new Set(
        notes.map(n => n.category)
    );

    document.getElementById("totalCategories").textContent =
        usedCategories.size;

}

// PAPAR NOTA
function renderNotes() {

    const container = document.getElementById("notesContainer");

    const search = document.getElementById("searchInput")
        .value.toLowerCase();

    const filter = document.getElementById("categoryFilter").value;

    const filteredNotes = notes.filter(note => {

        const matchSearch =
            note.title.toLowerCase().includes(search) ||
            note.content.toLowerCase().includes(search);

        const matchCategory =
            filter === "Semua Nota" ||
            note.category === filter;

        return matchSearch && matchCategory;

    });

    container.innerHTML = "";

    if (filteredNotes.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h3>Tiada nota dijumpai</h3>
                <p>Tambah nota baharu untuk memulakan koleksi anda.</p>
            </div>
        `;

        return;
    }

    filteredNotes.forEach(note => {

        const card = document.createElement("div");
        card.className = "note-card";

        const category = document.createElement("span");
        category.className = "category";
        category.textContent = note.category;

        const title = document.createElement("h3");
        title.textContent = note.title;

        const content = document.createElement("p");
        content.textContent = note.content.length > 180
            ? note.content.substring(0, 180) + "..."
            : note.content;

        const date = document.createElement("div");
        date.className = "note-date";
        date.textContent = "Dikemaskini: " + note.date;

        const actions = document.createElement("div");
        actions.className = "note-actions";

        const edit = document.createElement("button");
        edit.className = "edit-btn";
        edit.textContent = "✏️ Edit";
        edit.onclick = () => editNote(note.id);

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "🗑 Padam";
        del.onclick = () => deleteNote(note.id);

        actions.append(edit, del);
        card.append(category, title, content, date, actions);
        container.appendChild(card);

    });

}

// BUKA MODAL
function openModal() {

    document.getElementById("noteForm").reset();
    document.getElementById("noteId").value = "";
    document.getElementById("modalTitle").textContent =
        "Tambah Nota Baharu";

    document.getElementById("noteModal").style.display = "flex";

}

// TUTUP MODAL
function closeModal() {
    document.getElementById("noteModal").style.display = "none";
}

// TAMBAH DAN EDIT NOTA
document.getElementById("noteForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const id = document.getElementById("noteId").value;

    const title = document.getElementById("noteTitle").value.trim();
    const category = document.getElementById("noteCategory").value;
    const content = document.getElementById("noteContent").value.trim();

    if (!title || !content) return;

    const date = new Date().toLocaleDateString("ms-MY");

    if (id) {

        const index = notes.findIndex(n => n.id === id);

        if (index !== -1) {
            notes[index] = {
                id,
                title,
                category,
                content,
                date
            };
        }

    } else {

        notes.unshift({
            id: Date.now().toString(),
            title,
            category,
            content,
            date
        });

    }

    saveData();
    renderNotes();
    closeModal();

});

// EDIT NOTA
function editNote(id) {

    const note = notes.find(n => n.id === id);

    if (!note) return;

    document.getElementById("noteId").value = note.id;
    document.getElementById("noteTitle").value = note.title;
    document.getElementById("noteCategory").value = note.category;
    document.getElementById("noteContent").value = note.content;

    document.getElementById("modalTitle").textContent =
        "Kemaskini Nota";

    document.getElementById("noteModal").style.display = "flex";

}

// PADAM NOTA
function deleteNote(id) {

    if (!confirm("Adakah anda pasti mahu memadam nota ini?")) {
        return;
    }

    notes = notes.filter(n => n.id !== id);

    saveData();
    renderNotes();

}

// FILTER KATEGORI
function filterCategory(category, button) {

    currentCategory = category;

    document.getElementById("categoryFilter").value = category;

    document.getElementById("sectionTitle").textContent = category;

    document.querySelectorAll(".sidebar button")
        .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    renderNotes();

}

// EXPORT NOTA
function exportNotes() {

    const data = JSON.stringify(notes, null, 2);

    const blob = new Blob([data], {
        type: "application/json"
    });

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "Backup_Geomatik_Notes.json";
    a.click();

    URL.revokeObjectURL(url);

}

// IMPORT NOTA
function importNotes(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        try {

            const imported = JSON.parse(e.target.result);

            if (!Array.isArray(imported) ||
                !imported.every(n =>
                    n &&
                    typeof n.id === "string" &&
                    typeof n.title === "string" &&
                    typeof n.content === "string" &&
                    categories.includes(n.category)
                )) {
                throw new Error("Format tidak sah");
            }

            if (!confirm("Import akan menggantikan semua nota sedia ada. Teruskan?")) {
                return;
            }

            notes = imported;

            saveData();
            renderNotes();

            alert("Nota berjaya diimport!");

        } catch (error) {

            alert("Fail tidak sah atau format tidak disokong.");

        }

        event.target.value = "";

    };

    reader.readAsText(file);

}

// PAPARAN AWAL
setupCategories();
updateStats();
renderNotes();

</script>

</body>
</html>
