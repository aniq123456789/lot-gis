<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <title>Cempaka Digital Resident - PUO</title>
        
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

        <style>
            body, html { height: 100%; margin: 0; font-family: 'Poppins', sans-serif; overflow: hidden; }
            
            #login-overlay {
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: linear-gradient(135deg, #1a252f 0%, #2c3e50 100%);
                z-index: 10000; display: flex; align-items: center; justify-content: center;
            }
            .login-card {
                background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                width: 100%; max-width: 400px; text-align: center;
            }
            .login-logos { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
            .login-logos img { height: 60px; width: auto; }
            .login-card h2 { font-weight: 800; color: #1a252f; margin-bottom: 5px; }
            .login-card p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
            .form-control { border-radius: 8px; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; }
            .btn-login { background: #e74c3c; color: white; width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; border: none; transition: 0.3s; }
            .btn-login:hover { background: #c0392b; transform: translateY(-2px); }

            header {
                position: relative; height: 130px; width: 100%; overflow: hidden;
                display: flex; align-items: center; justify-content: center; color: white;
                border-bottom: 5px solid #e74c3c; z-index: 1000;
            }
            #header-video {
                position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%;
                width: auto; height: auto; transform: translate(-50%, -50%);
                z-index: -1; filter: brightness(25%); object-fit: cover;
            }
            .header-content { display: flex; align-items: center; width: 96%; justify-content: space-between; z-index: 1; }
            .logo-poli, .logo-puo { height: 80px; }

            #wrapper { display: flex; width: 100%; height: calc(100vh - 130px); }
            #sidebar { min-width: 340px; background: #ffffff; display: flex; flex-direction: column; box-shadow: 5px 0 15px rgba(0,0,0,0.1); z-index: 1050; transition: 0.3s; }
            #sidebar.active { margin-left: -340px; }
            #map-container { flex-grow: 1; position: relative; background: #eee; }
            #map { width: 100%; height: 100%; cursor: crosshair; }
            
            #sidebarCollapse { position: absolute; top: 15px; left: 15px; z-index: 1000; background: #1a252f; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
            .card-menu { background: #fff; border-radius: 12px; padding: 15px; margin: 15px; border: 1px solid #eee; }
            .card-menu h6 { font-weight: 700; color: #1a252f; margin-bottom: 12px; border-bottom: 2px solid #e74c3c; padding-bottom: 8px; }
            .info-box { background: #f8f9fa; padding: 10px; border-radius: 8px; border-left: 5px solid #e74c3c; margin-bottom: 10px; }
            .info-label { font-size: 10px; text-transform: uppercase; color: #95a5a6; font-weight: 800; display: block; }
            .info-value { font-size: 15px; color: #2c3e50; font-weight: 700; display: block; }
            .btn-pdf { background: #27ae60; color: white; width: 100%; border: none; padding: 12px; border-radius: 8px; font-weight: 700; }

            /* TOOLTIP KOORDINAT */
            .batu-tooltip {
                background: #1a252f !important;
                border: 2px solid #ffff00 !important;
                color: #ffffff !important;
                font-weight: bold !important;
                border-radius: 5px !important;
                padding: 5px !important;
                font-size: 11px !important;
            }

            #loading-overlay {
                display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); 
                z-index: 9999; color:white; text-align:center; padding-top:20%;
            }
        </style>
    </head>
    <body>

        <div id="login-overlay">
            <div class="login-card">
                <div class="login-logos">
                    <img src="Poli_Logo.png" alt="Logo Politeknik">
                    <img src="image_247e7c.png" alt="Logo PUO">
                </div>
                <h2>Log Masuk</h2>
                <p>Sistem Maklumat Lot Cempaka Resident</p>
                <input type="text" id="username" class="form-control" placeholder="ID Pengguna">
                <input type="password" id="password" class="form-control" placeholder="Kata Laluan">
                <button class="btn-login" onclick="checkLogin()">MASUK SISTEM</button>
            </div>
        </div>

        <div id="loading-overlay">
            <div class="spinner-border text-light mb-3"></div>
            <h3>Menjana Laporan PDF...</h3>
        </div>

        <img id="logoPuoRef" src="image_247e7c.png" style="display:none;">
        <img id="logoPoliRef" src="Poli_Logo.png" style="display:none;">

        <header>
            <video autoplay muted loop playsinline id="header-video">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-technology-digital-interface-background-31776-large.mp4" type="video/mp4">
            </video>
            <div class="header-content">
                <img src="Poli_Logo.png" class="logo-poli">
                <div class="text-center">
                    <h1 class="m-0 fw-bold">Cempaka Digital Resident</h1>
                    <p class="m-0 text-warning">Sistem Maklumat Lot Tanah Terdigital (Jabatan Geomatik)</p>
                </div>
                <img src="image_247e7c.png" class="logo-puo">
            </div>
        </header>

        <div id="wrapper">
            <nav id="sidebar">
                <div class="card-menu">
                    <h6>Butiran Lot</h6>
                    <div id="lotDataDisplay">
                        <div class="info-box">
                            <span class="info-label">Nombor Lot</span>
                            <span id="res-no-lot" class="info-value">-</span>
                        </div>
                        <div class="info-box">
                            <span class="info-label">Keluasan</span>
                            <span id="res-luas" class="info-value">-</span>
                        </div>
                        <div class="info-box">
                            <span class="info-label">Pemilik</span>
                            <span id="res-owner" class="info-value">-</span>
                        </div>
                        <button class="btn btn-pdf" onclick="generateFinalPDF()">
                            <i class="fas fa-file-download"></i> MUAT TURUN LAPORAN PDF
                        </button>
                    </div>
                </div>
                <div class="card-menu">
                    <h6>Carian Lot</h6>
                    <select id="lotSearchSelector" class="form-select">
                        <option value="">-- Pilih Nombor Lot --</option>
                    </select>
                </div>
            </nav>

            <div id="map-container">
                <button id="sidebarCollapse"><i class="fas fa-bars"></i></button>
                <div id="map"></div>
            </div>
        </div>

        <script src="js/leaflet.js"></script>
        <script src="data/LOTFINAL_0.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <script>
            function checkLogin() {
                const user = document.getElementById('username').value;
                const pass = document.getElementById('password').value;
                if (user === "1" && pass === "admin") {
                    document.getElementById('login-overlay').style.display = 'none';
                    map.invalidateSize();
                }
            }

            var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([2.10385, 102.5214], 19);
            L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 22, crossOrigin: 'anonymous' }).addTo(map);

            var highlightLayer;
            window.selectedLotData = { lot: "-", owner: "-", area: "-" };

            function updateDisplay(props) {
                const lot = props['NO LOT'] || "-";
                const owner = props['tsp — pe'] || props['Pemilik'] || "Jabatan Geomatik (PUO)";
                const area = props['AREA'] ? parseFloat(props['AREA']).toFixed(3) + " m²" : "-";
                document.getElementById('res-no-lot').innerText = lot;
                document.getElementById('res-owner').innerText = owner;
                document.getElementById('res-luas').innerText = area;
                window.selectedLotData = { lot, owner, area };
            }

            // FUNGSI LUKIS BATU (VERSI STABLE)
            function addBatuSempadan(latlng) {
                var lat = latlng.lat;
                var lng = latlng.lng;
                
                var marker = L.circleMarker(latlng, {
                    radius: 10, // BESAR SIKIT LAGI MACAM KAU NAK
                    fillColor: "#ffff00",
                    color: "#000000",
                    weight: 2,
                    fillOpacity: 1,
                    pane: 'markerPane'
                }).addTo(map);

                marker.bindTooltip(`
                    <div style="text-align:center;">
                        <b>BATU SEMPADAN</b><br>
                        Latit: ${lat.toFixed(7)}<br>
                        Dipat: ${lng.toFixed(7)}
                    </div>`, {
                    sticky: true,
                    className: 'batu-tooltip',
                    offset: [0, -5]
                });
            }

            // LOAD DATA ASAL
            var lotLayer = L.geoJson(json_LOTFINAL_0, {
                style: { color: 'white', weight: 1.5, fillColor: '#e74c3c', fillOpacity: 0.3 },
                onEachFeature: function(feature, layer) {
                    if (feature.properties['NO LOT']) {
                        $('#lotSearchSelector').append(`<option value="${feature.properties['NO LOT']}">Lot ${feature.properties['NO LOT']}</option>`);
                    }

                    // Logik Lukis Batu Sempadan Tanpa Crash
                    if (layer.getLatLngs) {
                        var shape = layer.getLatLngs();
                        // Iterasi koordinat mengikut struktur Leaflet (Polygon/MultiPolygon)
                        shape.forEach(function(part) {
                            if (Array.isArray(part[0])) { 
                                part.forEach(function(ring) { 
                                    ring.forEach(function(coord) { addBatuSempadan(coord); }); 
                                });
                            } else {
                                part.forEach(function(coord) { addBatuSempadan(coord); });
                            }
                        });
                    }

                    layer.on('mouseover', function(e) {
                        e.target.setStyle({ weight: 3, color: '#ffff00', fillOpacity: 0.6 });
                        updateDisplay(e.target.feature.properties);
                    });

                    layer.on('mouseout', function(e) {
                        if (highlightLayer !== e.target) { lotLayer.resetStyle(e.target); }
                    });

                    layer.on('click', function(e) {
                        if (highlightLayer) { lotLayer.resetStyle(highlightLayer); }
                        highlightLayer = e.target;
                        highlightLayer.setStyle({ weight: 5, color: '#ffff00', fillOpacity: 0.4 });
                        map.flyToBounds(e.target.getBounds(), { padding: [100, 100] });
                        updateDisplay(e.target.feature.properties);
                    });
                }
            }).addTo(map);

            $('#lotSearchSelector').change(function() {
                var val = $(this).val();
                lotLayer.eachLayer(layer => {
                    if (layer.feature.properties['NO LOT'] == val) {
                        if (highlightLayer) { lotLayer.resetStyle(highlightLayer); }
                        highlightLayer = layer;
                        highlightLayer.setStyle({ weight: 5, color: '#ffff00', fillOpacity: 0.4 });
                        map.flyToBounds(layer.getBounds(), { padding: [100, 100] });
                        updateDisplay(layer.feature.properties);
                    }
                });
            });

            $('#sidebarCollapse').click(function() { $('#sidebar').toggleClass('active'); });

            async function generateFinalPDF() {
                if(window.selectedLotData.lot === "-") { alert("Sila pilih satu lot."); return; }
                document.getElementById('loading-overlay').style.display = "block";
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('l', 'mm', 'a3'); 
                    const canvas = await html2canvas(document.getElementById('map'), { useCORS: true, scale: 2 });
                    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 97, 14, 308, 269);
                    doc.save(`Laporan_Lot_${window.selectedLotData.lot}.pdf`);
                } catch (err) { alert("Ralat PDF."); }
                finally { document.getElementById('loading-overlay').style.display = "none"; }
            }
        </script>
    </body>
</html>
